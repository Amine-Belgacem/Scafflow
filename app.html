<!DOCTYPE html>
<html class="h-100">

<head>
    <meta charset="utf-8">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/dataTables.bootstrap4.css">
    <link rel="stylesheet" href="assets/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="h-100">
    <div class="container h-100 mw-100 p-0">
        <div class="row h-100 m-0">
            <div class="col text-center left-bar">
                <div class="row justify-content-end h-100">
                    <div class="col">
                        <button class="btn button" type="button" id="newBtn">
                            <i class="fas fa-plus-square d-flex justify-content-center"></i>
                        </button>
                        <button class="btn button m-2" type="button" id="mainBtn">
                            <i class="fas fa-list-ul d-flex justify-content-center"></i>
                        </button>
                    </div>
                    <div class="col align-self-end">
                        <button class="btn button" id="settingBtn" type="button">
                            <i class="fas fa-cog d-flex justify-content-center"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col" style="overflow: hidden">
                <div class="d-flex flex-column h-100">
                    <div class="row flex-grow-1">
                        <div class="col p-0 height scrollable" id="main">
                            <table id="list" class="table table-striped mw-100">
                                <thead>
                                    <tr>
                                        <th style="width: 22px"></th>
                                        <th></th>
                                        <th class="w-35">Project</th>
                                        <th>Structure</th>
                                        <th>Start</th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                        <div class="col h-100 scrollable hidden" id="new">
                            <form id="newForm">
                                <div class="form-group">
                                    <legend>Project</legend>
                                    <div class="form-row">
                                        <div class="col">
                                            <div class="form-group">
                                                <label for="name">Project Name</label>
                                                <input class="form-control" type="text" id="name" required>
                                            </div>
                                        </div>
                                        <div class="col">
                                            <label for="struct">Project Structure</label>
                                            <select class="form-control" id="struct">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-row mt-2">
                                        <div class="col">
                                            <div class="form-group">
                                                <legend>Client Specifics</legend>
                                                <label for="company">Company</label>
                                                <input class="form-control" type="text" id="company">
                                            </div>
                                            <div class="form-group">
                                                <label for="website">Website</label>
                                                <input class="form-control" type="url" id="website">
                                            </div>
                                            <div class="form-group">
                                                <label for="country">Country</label>
                                                <select class="form-control" id="country"></select>
                                            </div>
                                            <div class="form-group">
                                                <label for="business">Business Type</label>
                                                <select class="form-control" id="business">
                                                    <option value="Service-business" selected>Service Business</option>
                                                    <option value="Merchandising-business">Merchandising Business</option>
                                                    <option value="Manufacturing-business">Manufacturing Business</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="businessDesc">Business Description</label>
                                                <input class="form-control" type="text" id="businessDesc">
                                            </div>
                                            <div class="form-group">
                                                <label for="area">Area Served</label>
                                                <select class="form-control" id="area">
                                                    <option value="International" selected="">International</option>
                                                    <option value="National" selected="">National</option>
                                                    <option value="City">City</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="size">Size By Employees</label>
                                                <select class="form-control" id="size">
                                                    <option value="1-5" selected="">1-5</option>
                                                    <option value="5-20">5-20</option>
                                                    <option value="20-50">20-50</option>
                                                    <option value="50-100">50-100</option>
                                                    <option value="100-500">100-500</option>
                                                </select>
                                            </div>
                                            <label for="request">Request</label>
                                            <textarea class="form-control" id="request" style="height: 100px"></textarea>
                                        </div>
                                        <div class="col">
                                            <div class="form-group">
                                                <fieldset>
                                                    <legend>Design Specifics</legend>
                                                </fieldset>
                                                <label for="minimalism">Minimalism</label>
                                                <select class="form-control" id="minimalism">
                                                    <option value="Any" selected="">Any</option>
                                                    <option value="Minimal">Minimal</option>
                                                    <option value="Essential">Essential</option>
                                                    <option value="Complex">Complex</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="modernism">Modernism</label>
                                                <select class="form-control" id="modernism">
                                                    <option value="Any" selected="">Any</option>
                                                    <option value="Vintage">Vintage</option>
                                                    <option value="Modern">Modern</option>
                                                    <option value="Futuristic">Futuristic</option>
                                                </select>
                                            </div>
                                            <div class="form-group">
                                                <label for="priority">Priority</label>
                                                <select class="form-control" id="priority">
                                                    <option value="Identification" selected="">Identification</option>
                                                    <option value="Activity-illustration">Activity Illustration</option>
                                                    <option value="Value-communication">Values Communication</option>
                                                    <option value="Any" selected="">Any</option>
                                                </select>
                                            </div>
                                            <div class="form-row">
                                                <div class="col text-right d-flex justify-content-end">
                                                    <button class="btn btn-primary" type="submit">
                                                        <i class="fas fa-plus-square"></i>&nbsp;Deploy
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="col h-100 scrollable hidden" id="setting">
                            <div class="row">
                                <div class="col">
                                    <div class="form-group">
                                        <legend>Settings</legend>
                                        <label>Path to workspace</label>
                                        <div class="col d-flex justify-content-start align-items-center p-0">
                                            <input class="form-control" type="text" placeholder="Path.." id="path" disabled>
                                            <button class="btn btn-primary ml-1" type="button" id="browse">
                                                <i class="far fa-folder"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col">
                                            <button class="btn btn-primary" type="button" id="applyBtn">Apply</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col text-center align-self-center hidden" id="loading">
                            <span style="font-size: 18px">Doing wonders please wait...</span>
                            <br>
                            <span class="spinner-border load-spinner" role="status"></span>
                        </div>
                    </div>
                    <div class="row align-items-center hidden" id="bottomBar">
                        <div class="col d-flex justify-content-center align-items-center bottom-bar">
                            <input class="border search p-1" type="text" placeholder="Search" id="searchFld">
                            <button class="btn bottom-button ml-2" type="button" id="openBtn" disabled>
                                <i class="far fa-folder d-flex justify-content-center"></i>
                            </button>
                            <button class="btn bottom-button m-2" type="button" id="buildBtn" disabled>
                                <i class="fas fa-hammer d-flex justify-content-center"></i>
                            </button>
                            <button class="btn bottom-button" type="button" id="refreshBtn">
                                <i class="fas fa-sync-alt d-flex justify-content-center"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="toast bottom-toast hide" id="success" data-delay="3500">
            <div class="toast-header">
                <span class="mr-auto text-success">
                    <i class="far fa-check-circle"></i>
                    Building Finished
                </span>
                <button type="button" class="ml-2 mb-1 close" data-dismiss="toast">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="toast-body">
                <div>Success, all files has been generated.</div>
            </div>
        </div>
        <div class="modal fade" id="error" tabindex="-1"  aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <span class="modal-title text-danger">
                            <i class="far fa-times-circle"></i>&nbsp;Problem Proceeding
                        </span>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p id="errorMsg"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./app.js"></script>
</html>
